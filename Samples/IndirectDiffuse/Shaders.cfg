// D3D12: HitObject API, which requires Shader Model 6.9
#ifdef TARGET_D3D12
Shaders/Pathtracer.hlsl -T lib -D NRC_UPDATE=1 -D NRC_INDIRECT_DIFFUSE=1 -D ENABLE_SER=1 -m 6_9 --compilerOptionsDXIL="-enable-payload-qualifiers"
Shaders/Pathtracer.hlsl -T lib -D NRC_QUERY=1 -D NRC_INDIRECT_DIFFUSE=1 -D ENABLE_NRD={0,1} -D ENABLE_SER=1 -m 6_9 --compilerOptionsDXIL="-enable-payload-qualifiers"
Shaders/Pathtracer.hlsl -T lib -D SHARC_UPDATE=1 -D SHARC_INDIRECT_DIFFUSE=1 -D ENABLE_SER=1 -m 6_9 --compilerOptionsDXIL="-enable-payload-qualifiers -enable-16bit-types"
Shaders/Pathtracer.hlsl -T lib -D SHARC_QUERY=1 -D SHARC_INDIRECT_DIFFUSE=1 -D ENABLE_NRD={0,1} -D ENABLE_SER=1 -m 6_9 --compilerOptionsDXIL="-enable-payload-qualifiers"
#endif // TARGET_D3D12
// Vulkan: inline SPIR-V hit object instructions, at the regular shader model
#ifdef TARGET_VULKAN
Shaders/Pathtracer.hlsl -T lib -D NRC_UPDATE=1 -D NRC_INDIRECT_DIFFUSE=1 -D ENABLE_SER=1
Shaders/Pathtracer.hlsl -T lib -D NRC_QUERY=1 -D NRC_INDIRECT_DIFFUSE=1 -D ENABLE_NRD={0,1} -D ENABLE_SER=1
Shaders/Pathtracer.hlsl -T lib -D SHARC_UPDATE=1 -D SHARC_INDIRECT_DIFFUSE=1 -D ENABLE_SER=1
Shaders/Pathtracer.hlsl -T lib -D SHARC_QUERY=1 -D SHARC_INDIRECT_DIFFUSE=1 -D ENABLE_NRD={0,1} -D ENABLE_SER=1
#endif // TARGET_VULKAN
#endif // RTXGI_COMPILE_SER
